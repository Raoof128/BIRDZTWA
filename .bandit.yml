# Exclude paths
exclude_dirs:
  - /tests
  - /venv
  - /env
  - /.venv
  - /node_modules
  - /.pytest_cache
  - /.mypy_cache
  - /htmlcov
  - /dist
  - /build

# Skip specific tests
skips:
  - B101  # assert_used (allowed in tests)
  - B601  # paramiko (we use playwright, not paramiko)

# High confidence only
confidence: MEDIUM

# Output format
format: txt

